authentication:
  style: api-key-header
  header: API-Key
  ref: authentication/arkham-authentication.yml
idempotency:
  supported: false
  note: >-
    Arkham documents no idempotency-key mechanism. The API is overwhelmingly read-only (GET) blockchain
    intelligence; the few write operations (alerts, user entities, labels, WebSocket sessions) do not
    document an idempotency contract.
pagination:
  style: offset
  params:
    limit: Maximum results per page (defaults vary by endpoint)
    offset: Number of results to skip (default 0)
  response_fields: [count, total]
  limits:
    transfers: {default: 20, max: null, recommended: 50-500}
    swaps: {default: 50, max: null, recommended: 50-500}
    counterparties: {default: 1000, max: 1000}
    tokens: {default: 100, max: 250}
    tag_params: {default: 100, max: 1000}
  strategies: [offset-based, time-window-sliding]
  ref: https://arkm.com/llms/guides/pagination.md
timestamps:
  format: unix-milliseconds
  params: [timeGte, timeLte, timeLast]
  constraint: cannot use timeLast and timeGte together
error_envelope:
  rest: '{ "error": string }'
  websocket: '{ "type": "error", "payload": { code, message } }'
  ref: errors/arkham-error-codes.yml
rate_limit_signaling:
  throttle_status: 429
  retry_header: Retry-After
  intel_usage_headers: [X-Intel-Datapoints-Usage, X-Intel-Datapoints-Limit, X-Intel-Datapoints-Remaining]
  ref: rate-limits/arkham-rate-limits.yml
versioning:
  scheme: none-in-path
  current: '1.1.0'
  note: Version is carried in the OpenAPI info.version; base paths are unversioned under api.arkm.com.
  ref: lifecycle/arkham-lifecycle.yml
data_model:
  principles: [entity-first, confidence-scored, living-intelligence]
  core_objects: [address, entity, label, tag, token, transfer]
  ref: data-model/arkham-data-model.yml
agent_access:
  x402: https://api.arkm.com/x402
  note: Stateless pay-per-request (POST, params in JSON body) with USDC-on-Base settlement.
