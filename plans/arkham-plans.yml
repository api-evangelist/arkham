provider: Arkham
providerId: arkham
source: https://arkm.com/llms/guides/getting-access.md
tags:
- Blockchain Intelligence
- Crypto
- Usage-Based
description: >-
  Arkham API plans are custom-built (usage-based, credits per month) and start at $900/mo, with bespoke
  enterprise plans. Free trial access is available (Individual 1,000,000 credits; Organization 10,000,000
  credits). Credits are consumed per endpoint; failed requests are not charged. The x402 agent surface
  prices every request at $0.20 per credit in USDC on Base with no subscription.
sources:
