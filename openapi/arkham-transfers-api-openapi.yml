                  description: 'Transfer direction: ''in'' (incoming), ''out'' (outgoing), ''self'' (self-transfers), or ''all''. Default: all.'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                from:
                  description: Filter from any of these addresses, entities, deposit services, or service wallets. Prefix a value with '!' to exclude…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                granularity:
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                  description: 'Histogram bucket size. Calendar units: ''1m'' (minute), ''1h'' (hour), ''1d'' (day), ''1w'' (week), ''1M'' (month), ''1q'' (quarter…'
                timeGte:
                  description: Filter after a specific time (RFC3339, YYYY-MM-DD, or Unix timestamp).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                timeLast:
                  description: Filter using a duration string.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                timeLte:
                  description: Filter before a specific time (RFC3339, YYYY-MM-DD, or Unix timestamp).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                to:
                  description: Filter to any of these addresses, entities, deposit services, or service wallets. Prefix a value with '!' to exclude it…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                tokens:
                  description: Filter involving any of these token addresses or token IDs. Pass several as a single comma-separated value (e.g. 'ether…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                usdGte:
                  description: Filter above a minimum historical USD value.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                usdLte:
                  description: Filter below a maximum historical USD value.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                valueGte:
                  description: Filter above a minimum token amount (the quantity of tokens, not the USD value).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                valueLte:
                  description: Filter below a maximum token amount (the quantity of tokens, not the USD value).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
              required:
