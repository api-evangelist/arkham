                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                  description: Type of transfers to return. 'external' = native value transfers, 'internal' = trace calls, 'token' = ERC-20/TRC-20 tra…
              required:
              - hash
              - chain
              - transferType
              additionalProperties:
                anyOf:
                - type: string
                - type: number
                - type: boolean
                - type: array
                  items:
                    anyOf:
                    - type: string
                    - type: number
                    - type: boolean
            example:
              hash: '0xf141a777ec5211657989b167d137dbc74f1a97984ba8ce3925bd640b78702587'
              chain: ethereum
              transferType: token
      responses:
