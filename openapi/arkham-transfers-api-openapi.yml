            schema:
              type: object
              properties:
                hash:
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                  description: The transaction hash to retrieve transfers for.
