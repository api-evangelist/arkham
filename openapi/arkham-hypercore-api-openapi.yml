  /hypercore/trades:
    get:
      summary: Search HyperCore trades
      description: Filtered, sorted feed of HyperCore perp and spot fills merged under one limit, each enriched with the trader's entity and labels.
      operationId: GetHypercoreTradesFeed
      parameters:
      - name: base
        in: query
        description: 'Filter by trader: a comma-separated list of addresses and/or entity ids.'
        schema:
          type: array
          items:
            type: string
          description: 'Filter by trader: a comma-separated list of addresses and/or entity ids.'
          example:
          - wintermute
      - name: coins
        in: query
        description: Filter to these raw coin identifiers.
        schema:
          type: array
          items:
            type: string
          description: Filter to these raw coin identifiers.
          example:
          - BTC
      - name: pricingIds
        in: query
        description: 'Filter by token: CoinGecko pricing ids, expanded to every coin that resolves to them.'
        schema:
          type: array
          items:
            type: string
          description: 'Filter by token: CoinGecko pricing ids, expanded to every coin that resolves to them.'
          example:
          - bitcoin
      - name: side
        in: query
        description: 'Filter by side: ''buy'' or ''sell''.'
        schema:
          type: string
          description: 'Filter by side: ''buy'' or ''sell''.'
          example: buy
      - name: directions
        in: query
        description: Filter perp fills by direction label, for example 'Open Long'.
        schema:
          type: array
          items:
            type: string
          description: Filter perp fills by direction label, for example 'Open Long'.
          example:
          - Open Long
      - name: product
        in: query
        description: Limit to 'perp' or 'spot'; empty returns both.
        schema:
          type: string
          description: Limit to 'perp' or 'spot'; empty returns both.
          example: perp
      - name: crossed
        in: query
        description: Filter by whether the fill crossed the book.
        schema:
          type: boolean
          description: Filter by whether the fill crossed the book.
          nullable: true
          example: true
      - name: tags
        in: query
        description: Filter by trader address tags.
        schema:
          type: array
          items:
            type: string
            example: abc123
          description: Filter by trader address tags.
          example:
          - abc123
      - name: valueGte
        in: query
        description: Minimum notional value (price*size).
        style: deepObject
        explode: true
        schema:
          type: string
          description: Minimum notional value (price*size).
          nullable: true
          example: '1000'
      - name: valueLte
        in: query
        description: Maximum notional value.
        style: deepObject
        explode: true
        schema:
          type: string
          description: Maximum notional value.
          nullable: true
          example: '1000000'
      - name: sizeGte
        in: query
        description: Minimum fill size.
        style: deepObject
        explode: true
        schema:
          type: string
          description: Minimum fill size.
          nullable: true
          example: '0.001'
      - name: sizeLte
        in: query
        description: Maximum fill size.
        style: deepObject
        explode: true
        schema:
          type: string
          description: Maximum fill size.
          nullable: true
          example: '1000'
      - name: priceGte
        in: query
        description: Minimum fill price.
        style: deepObject
        explode: true
        schema:
          type: string
          description: Minimum fill price.
          nullable: true
          example: '1'
      - name: priceLte
        in: query
        description: Maximum fill price.
        style: deepObject
        explode: true
        schema:
          type: string
          description: Maximum fill price.
          nullable: true
          example: '1000000'
      - name: timeGte
        in: query
        description: Only fills at or after this time.
        schema:
          type: string
          description: Only fills at or after this time.
          nullable: true
          example: '2024-01-01T00:00:00Z'
      - name: timeLte
        in: query
        description: Only fills at or before this time.
        schema:
          type: string
          description: Only fills at or before this time.
          nullable: true
          example: '2024-01-01T00:00:00Z'
      - name: timeLast
        in: query
        description: Relative window, e.g. '24h' or '7d' (mutually exclusive with timeGte/timeLte).
        schema:
          type: string
          description: Relative window, e.g. '24h' or '7d' (mutually exclusive with timeGte/timeLte).
          example: 24h
      - name: sortKey
        in: query
        description: Sort by 'time', 'value', 'size', or 'price' (default 'time').
        schema:
          type: string
          description: Sort by 'time', 'value', 'size', or 'price' (default 'time').
          example: time
      - name: sortDir
        in: query
        description: '''asc'' or ''desc'' (default ''desc'').'
        schema:
          type: string
          description: '''asc'' or ''desc'' (default ''desc'').'
          example: desc
      - name: limit
        in: query
        description: Max trades to return (default 50, max 200).
        schema:
          type: integer
          description: Max trades to return (default 50, max 200).
          example: 50
      - name: offset
        in: query
        description: 'Pagination offset (offset+limit must be <= 10000). Default: 0.'
        schema:
          type: integer
          description: 'Pagination offset (offset+limit must be <= 10000). Default: 0.'
          example: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
