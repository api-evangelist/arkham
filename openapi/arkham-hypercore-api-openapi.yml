      parameters:
      - name: address
        in: path
        description: HyperCore master or sub-account address.
        required: true
        schema:
          type: string
          description: HyperCore master or sub-account address.
          example: '0xECB63caA47c7c4E77F60f1cE858Cf28dC2B82b00'
