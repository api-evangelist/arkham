  /token/holders/by-address:
    post:
      operationId: token_holders_by-address
      summary: Get Arkham top token holders by chain/address
      tags:
      - Token
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '6.00'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chain:
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                  description: Blockchain network where the token is deployed.
                address:
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                  description: The token contract address to query.
                groupByEntity:
                  description: If 'true', groups holdings by entity rather than individual addresses.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                limit:
                  description: Maximum number of holders to return per page (default 100, max 100). offset + limit must not exceed 1000.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                offset:
                  description: Number of holders to skip for pagination (default 0).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                poolAddress:
                  description: Optional Solana pool address. When provided, address holder unrealized PnL is calculated from this pool only.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
              additionalProperties:
                anyOf:
                - type: string
                - type: number
                - type: boolean
                - type: array
                  items:
                    anyOf:
                    - type: string
                    - type: number
                    - type: boolean
              anyOf:
              - required:
                - chain
                - address
            example:
              chain: ethereum
              address: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
      responses:
        '200':
          description: Successful response
          content:
