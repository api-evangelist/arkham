  /token/volume/{chain}/{address}:
    get:
      summary: Get volume for a token by chain/address
      description: 'Returns exchange flow for the specified token contract on a given chain, bucketed by time.


        Each bucket reports the token''s flows to and from the largest exchanges: inUSD and inValue are the amounts moving into exchanges, outUSD and outValue the amounts moving back out, denominated in USD and in token units respectively.


        This form looks the token up by its contract address, so it only covers chains that have token contracts (EVM chains, Solana, Tron). UTXO assets such as Bitcoin and Dogecoin have no token contract and return no data here; use the pricing-ID form (/token/volume/{id}) for their native flows.


        **Rate Limit**: This endpoint has a stricter rate limit of 1 request per second.'
      operationId: GetTokenVolumeByChainAddress
      parameters:
      - name: granularity
        in: query
        description: Bucket size for the histogram. Use a whole number of hours, from 1h up to 7d (e.g. 1h, 2h, 6h, 12h, 1d, 2d, 3d, 7d); sub-hour values and durations over 7d are rejected. Only applied when timeLast is under 30 days; for longer or omitted ranges, results are always returned in daily buckets.
        required: true
        schema:
          type: string
          description: Bucket size for the histogram. Use a whole number of hours, from 1h up to 7d (e.g. 1h, 2h, 6h, 12h, 1d, 2d, 3d, 7d); sub-hour values and durations over 7d are rejected. Only applied when timeLast is under 30 days; for longer or omitted ranges, results are always returned in daily buckets.
          nullable: true
          example: 1h
      - name: timeLast
        in: query
        description: Time range to return, as a relative duration such as '24h', '7d', or '60d'. Under 30 days, results honor granularity; 30 days or longer returns daily buckets. If omitted, returns all-time data in daily buckets.
        schema:
          type: string
          description: Time range to return, as a relative duration such as '24h', '7d', or '60d'. Under 30 days, results honor granularity; 30 days or longer returns daily buckets. If omitted, returns all-time data in daily buckets.
          nullable: true
          example: 24h
      - name: chain
        in: path
        description: Blockchain network where the token is deployed.
        required: true
        schema:
          $ref: '#/components/schemas/Chain'
      - name: address
        in: path
        description: The token contract address.
        required: true
        schema:
          type: string
          description: The token contract address.
          example: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
