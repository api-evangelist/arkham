components:
  schemas:
    Chain:
      enum:
      - ethereum
      - polygon
      - bsc
      - optimism
      - avalanche
      - arbitrum_one
      - base
      - bitcoin
      - tron
      - flare
      - solana
      - dogecoin
      - zcash
      - hyperevm
      - hypercore
      type: string
      example: ethereum
    Label:
      required:
      - name
      - address
      - chainType
      type: object
      properties:
        address:
          type: string
          example: '0x28C6c06298d514Db089934071355E5743bf21d60'
        chainType:
          type: string
          example: evm
        name:
          type: string
          example: Cold Wallet
        note:
          type: string
          example: ''
      example:
        address: '0x28C6c06298d514Db089934071355E5743bf21d60'
        chainType: evm
        name: Cold Wallet
        note: ''
    Chains:
      type: array
      items:
        $ref: '#/components/schemas/Chain'
      example:
      - ethereum
      - bsc
      - polygon
    CounterpartyFlow:
      enum:
      - in
      - out
      type: string
      example: in
    Counterparty:
      required:
      - address
      - usd
      - transactionCount
      - flow
      - chains
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
        chains:
          type: array
          items:
            $ref: '#/components/schemas/Chain'
          description: Chains on which this counterparty interacted with the queried subject.
          nullable: true
          example:
          - ethereum
        flow:
          type: string
          description: Direction of value flow relative to the queried address, e.g. in or out.
          example: in
        transactionCount:
          minimum: 0
          type: integer
          description: Number of transfers between the queried subject and this counterparty.
          example: 223156
        usd:
          type: number
          description: Aggregated USD value of transfers between the queried subject and this counterparty.
          example: 331013556816.85
