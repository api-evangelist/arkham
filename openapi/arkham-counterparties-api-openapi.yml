  contact:
    name: Arkham Intelligence
    email: api@arkm.com
    url: https://api.arkm.com/x402
servers:
- url: https://api.arkm.com/x402
tags:
- name: Counterparties
paths:
  /counterparties/address:
    post:
      operationId: counterparties_address
      summary: Get top Arkham counterparties for an address
      tags:
      - Counterparties
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '10.00'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                  description: The address to query counterparties for. A comma-separated list is also accepted — their counterparties are aggregated…
                chains:
                  description: Chains to filter by, as a single comma-separated value (e.g. 'base,bsc'). If omitted, returns counterparties across all…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                flow:
                  description: Transfer direction. Only "in" or "out" are accepted (omit for both directions).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                limit:
                  description: 'Maximum number of results to return. Default: 20. Max: 1000.'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                tags:
                  description: List of counterparty tags to filter by. Pass several as a single comma-separated value (e.g. 'whale,kol').
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                timeGte:
                  description: Filter to activity after this time. Accepts RFC 3339, Unix seconds/ms, or YYYY-MM-DD.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                timeLast:
                  description: Filter to activity within this duration before now (e.g. 24h, 7d). Cannot be combined with timeGte/timeLte.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                timeLte:
                  description: Filter to activity before this time. Accepts RFC 3339, Unix seconds/ms, or YYYY-MM-DD.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                tokens:
                  description: Matches counterparties involving any of these token addresses or token IDs. Pass several as a single comma-separated va…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                usdGte:
                  description: Filter to counterparties whose aggregated USD volume is at least this value.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
              required:
              - address
              additionalProperties:
                anyOf:
                - type: string
                - type: number
                - type: boolean
                - type: array
                  items:
                    anyOf:
                    - type: string
                    - type: number
                    - type: boolean
            example:
              address: '0x28C6c06298d514Db089934071355E5743bf21d60'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {}
        '400':
          $ref: '#/components/responses/BadRequest400'
        '402':
          $ref: '#/components/responses/PaymentRequired402'
        '404':
          $ref: '#/components/responses/NotFound404'
        '429':
          $ref: '#/components/responses/RateLimited429'
        5XX:
          $ref: '#/components/responses/UpstreamError5xx'
      security: []
      description: Get top Arkham counterparties for an address. $10.00 per call.
  /counterparties/entity:
    post:
      operationId: counterparties_entity
      summary: Get top Arkham counterparties for an entity
      tags:
      - Counterparties
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '10.00'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entity:
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                  description: The entity ID to query counterparties for. IDs are case-sensitive; look one up with GET /intelligence/search.
                chains:
                  description: Chains to filter by, as a single comma-separated value (e.g. 'base,bsc'). If omitted, returns counterparties across all…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                flow:
                  description: Transfer direction. Only "in" or "out" are accepted (omit for both directions).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                limit:
                  description: 'Maximum number of results to return. Default: 20. Max: 1000.'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                tags:
                  description: List of counterparty tags to filter by. Pass several as a single comma-separated value (e.g. 'whale,kol').
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                timeGte:
                  description: Filter to activity after this time. Accepts RFC 3339, Unix seconds/ms, or YYYY-MM-DD.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                timeLast:
                  description: Filter to activity within this duration before now (e.g. 24h, 7d). Cannot be combined with timeGte/timeLte.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                timeLte:
                  description: Filter to activity before this time. Accepts RFC 3339, Unix seconds/ms, or YYYY-MM-DD.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                tokens:
                  description: Matches counterparties involving any of these token addresses or token IDs. Pass several as a single comma-separated va…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                usdGte:
                  description: Filter to counterparties whose aggregated USD volume is at least this value.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
              required:
              - entity
              additionalProperties:
                anyOf:
                - type: string
                - type: number
                - type: boolean
                - type: array
                  items:
                    anyOf:
                    - type: string
                    - type: number
                    - type: boolean
            example:
              entity: vitalik-buterin
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {}
        '400':
          $ref: '#/components/responses/BadRequest400'
        '402':
          $ref: '#/components/responses/PaymentRequired402'
        '404':
          $ref: '#/components/responses/NotFound404'
        '429':
          $ref: '#/components/responses/RateLimited429'
        5XX:
          $ref: '#/components/responses/UpstreamError5xx'
      security: []
      description: Get top Arkham counterparties for an entity. $10.00 per call.
components:
  responses:
    RateLimited429:
      description: Per-wallet endpoint rate limit exceeded. Retry with at least 1 second of backoff; keep heavy endpoints at no more than 5 requests per second.
    PaymentRequired402:
      description: 'Payment challenge, not an application error. Read the base64 x402 v2 challenge from PAYMENT-REQUIRED, sign it, and retry the same request with PAYMENT-SIGNATURE. If a post-payment 402 omits PAYMENT-REQUIRED, verification failed: read the new challenge, re-sign, and retry once.'
      headers:
        PAYMENT-REQUIRED:
          description: Base64-encoded x402 v2 payment requirements. Its accepts array contains the scheme, network, asset, atomic amount, and payTo address.
          schema:
            type: string
    NotFound404:
      description: The upstream Arkham resource does not exist. Fatal for the same input. Payment is not settled.
    UpstreamError5xx:
      description: Arkham failed or timed out, including 502 and 504 responses. Retry with backoff. x402 payments and MPP transaction credentials are not settled for failed requests; MPP hash credits are redeemed at admission and are not refunded automatically.
    BadRequest400:
      description: 'Fatal for the request as written: validation failed or required JSON body fields are missing. Fix the request; do not retry it unchanged. Payment is not settled.'
      content:
        application/json:
          schema:
            type: object
            required:
            - success
            - error
            properties:
              success:
                type: boolean
                enum:
                - false
              error:
                type: string
              issues:
                type: array
                description: Per-field validation issues, present when schema validation produced them.
  securitySchemes:
    siwx:
      type: apiKey
      in: header
      name: SIGN-IN-WITH-X
