        contribution_usd: 1503.02
        direction: forward
        first_ts: '2019-11-14T00:00:00Z'
        hop_distance: 1
        last_ts: '2019-12-13T00:00:00Z'
        risk_category: hacker
        seed_address: '0x851d8fe098341d5592DbBC7bCd4388F73c16291b'
