                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                from:
                  description: Start of time window (use with 'to', max 7-day window). Provide together with 'to' as an alternative to 'since'; mutual…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                limit:
                  description: Maximum results to return (1-1000, default 100).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                orderBy:
                  description: 'Sort order: ''time'' (asc) or ''rank'' (desc). Default ''time''.'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                pageToken:
                  description: Cursor token for pagination (from previous response). Accepted only with orderBy 'time'.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                since:
                  description: Returns changes since this time. Required unless both 'from' and 'to' are provided; mutually exclusive with 'from'/'to'.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                status:
                  description: Filter by change status. For address tags only 'new', 'deleted', and 'all' are valid (no 'updated').
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                tagId:
                  description: Tag IDs to filter by. Max 100. Pass several as a single comma-separated value (e.g. 'contract-deployer,early-token-hold…
                  anyOf:
