  contact:
    name: Arkham Intelligence
    email: api@arkm.com
    url: https://api.arkm.com/x402
servers:
- url: https://api.arkm.com/x402
tags:
- name: Intelligence
paths:
  /intelligence/address-all:
    post:
      operationId: intelligence_address-all
      summary: Get Arkham intelligence for an address across all chains
      tags:
      - Intelligence
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.40'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                  description: The blockchain address to query across all compatible chains.
              required:
              - address
              additionalProperties:
                anyOf:
                - type: string
                - type: number
                - type: boolean
                - type: array
                  items:
                    anyOf:
                    - type: string
                    - type: number
                    - type: boolean
            example:
              address: '0x28C6c06298d514Db089934071355E5743bf21d60'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {}
        '400':
          $ref: '#/components/responses/BadRequest400'
        '402':
          $ref: '#/components/responses/PaymentRequired402'
        '404':
          $ref: '#/components/responses/NotFound404'
        '429':
          $ref: '#/components/responses/RateLimited429'
        5XX:
          $ref: '#/components/responses/UpstreamError5xx'
      security: []
      description: Get Arkham intelligence for an address across all chains. $0.40 per call.
