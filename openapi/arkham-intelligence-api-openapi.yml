                  template: Brokerage
                latest_diff_ts: '2025-12-19T05:33:00Z'
                pageToken: eyJkIjoiMjAyNS0xMi0xOVQwNTozMzowMFoiLCJxIjoyOX0=
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
      tags:
      - Intelligence
