components:
  schemas:
    Chain:
      enum:
      - ethereum
      - polygon
      - bsc
      - optimism
      - avalanche
      - arbitrum_one
      - base
      - bitcoin
      - tron
      - flare
      - solana
      - dogecoin
      - zcash
      - hyperevm
      - hypercore
      type: string
      example: ethereum
    EntityBalanceChangesOrderBy:
      enum:
      - balanceUsd
      - balanceUsdChange
      - balanceUsdPctChange
      - balanceUnit
      - balanceUnitChange
      - balanceUnitPctChange
      type: string
      example: balanceUsd
    Chains:
      type: array
      items:
        $ref: '#/components/schemas/Chain'
      example:
      - ethereum
      - bsc
      - polygon
    SearchTag:
      required:
      - value
      - formatted
      type: object
      properties:
        formatted:
          type: string
          example: Hot Wallet
        value:
          type: string
          example: hot-wallet
      example:
        formatted: Hot Wallet
        value: hot-wallet
    EnrichedContract:
      required:
      - address
      - bytecode
      - functionSighashes
      - isProxy
      - proxyAddress
      - blockTimestamp
      - deployer
      - internalDeployer
      - transactionHash
      type: object
      properties:
        address:
          type: string
          example: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        blockTimestamp:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00Z'
        bytecode:
          type: string
          example: '0x608060405234801561001057600080fd5b50'
        deployer:
          $ref: '#/components/schemas/Address'
        functionSighashes:
          type: array
          items:
            type: string
          nullable: true
          example:
          - '0xa9059cbb'
          - '0x70a08231'
        internalDeployer:
          $ref: '#/components/schemas/Address'
        isProxy:
          type: boolean
          example: true
        proxyAddress:
          type: string
          nullable: true
          example: '0x43506849D7C04F9138D1A2050bbF3A0c054402dd'
        transactionHash:
          type: string
          example: '0x2f1c5c2b44f771e942a8506148e256f94f1a464babc938ae0690c6e34cd79190'
      example:
        address: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
