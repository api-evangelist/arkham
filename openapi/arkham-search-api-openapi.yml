    name: Arkham Intelligence
    email: api@arkm.com
    url: https://api.arkm.com/x402
servers:
- url: https://api.arkm.com/x402
tags:
- name: Search
paths:
  /search:
    post:
      operationId: search
      summary: Search Arkham addresses, entities, tokens, pools, and names
      tags:
      - Search
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '6.00'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                arkhamAddresses:
                  description: Max Arkham-curated addresses with labels to return (0–50, default 5).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                arkhamAddressesOffset:
                  description: Skip the first N Arkham addresses with labels (0–500, default 0).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                arkhamEntities:
                  description: Max Arkham-curated entities to return (0–50, default 5).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                arkhamEntitiesOffset:
                  description: Skip the first N Arkham entities (0–500, default 0).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                ens:
                  description: Max ENS primary names to return (0–50, default 5).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                ensOffset:
                  description: Skip the first N ENS names (0–500, default 0).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                filterLimits:
                  description: (Legacy. Prefer flat parameters such as arkhamAddresses=50.) URL-encoded JSON object specifying maximum results per cat…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                filterOffsets:
                  description: (Legacy. Prefer flat parameters such as arkhamAddressesOffset=10.) URL-encoded JSON object specifying pagination offset…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                fomo:
                  description: Max Fomo usernames to return (0–50, default 5).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                fomoOffset:
                  description: Skip the first N Fomo usernames (0–500, default 0).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                opensea:
                  description: Max OpenSea usernames to return (0–50, default 5).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                openseaOffset:
                  description: Skip the first N OpenSea usernames (0–500, default 0).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                polymarketEvents:
                  description: Max Polymarket prediction events to return (0–50, default 0). Also enables the predictions-wallet match for address que…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                pools:
                  description: Max Solana pools to return (0–50, default 5).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                poolsOffset:
                  description: Skip the first N pools (0–500, default 0).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                pumpfun:
                  description: Max pump.fun usernames to return (0–50, default 5).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                pumpfunOffset:
                  description: Skip the first N pump.fun usernames (0–500, default 0).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                query:
                  description: Search query string to match against entities, addresses, tokens, pools, ENS names, and more. An empty query returns no…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                services:
                  description: Max CEX/VASP entities to return (0–50, default 5).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                servicesOffset:
                  description: Skip the first N CEX/VASP entities (0–500, default 0).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                tags:
                  description: Max tag matches to return (0–50, default 0).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                tagsOffset:
                  description: Skip the first N tag matches (0–500, default 0).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                tokens:
                  description: Max tokens to return (0–50, default 5).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                tokensOffset:
                  description: Skip the first N tokens (0–500, default 0).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                twitter:
                  description: Max Twitter-handle matches to return (0–50, default 5).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                twitterOffset:
