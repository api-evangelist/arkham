components:
  schemas:
    Chain:
      enum:
      - ethereum
      - polygon
      - bsc
      - optimism
      - avalanche
      - arbitrum_one
      - base
      - bitcoin
      - tron
      - flare
      - solana
      - dogecoin
      - zcash
      - hyperevm
      - hypercore
      type: string
      example: ethereum
    Label:
      required:
      - name
      - address
      - chainType
      type: object
      properties:
        address:
          type: string
          example: '0x28C6c06298d514Db089934071355E5743bf21d60'
        chainType:
          type: string
          example: evm
        name:
          type: string
          example: Cold Wallet
        note:
          type: string
          example: ''
      example:
        address: '0x28C6c06298d514Db089934071355E5743bf21d60'
        chainType: evm
        name: Cold Wallet
        note: ''
    Chains:
      type: array
      items:
        $ref: '#/components/schemas/Chain'
      example:
      - ethereum
      - bsc
      - polygon
    LoanBalance:
      required:
      - name
      - symbol
      - id
      - balance
      - usd
      - price
      - price24hAgo
      - quoteTime
      type: object
      properties:
        address:
          type: string
          example: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        balance:
          type: number
          example: 1.23
        balanceExact:
          type: string
          nullable: true
          example: abc123
        id:
          type: string
          nullable: true
          example: usd-coin
        market:
          type: string
          nullable: true
          example: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        name:
          type: string
          nullable: true
          example: USD Coin
        price:
          type: number
          example: 1.23
        price24hAgo:
          type: number
          example: 1.23
        protocol:
          type: string
          example: aave
        proxy:
          type: string
          nullable: true
          example: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        quoteTime:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00Z'
        symbol:
          type: string
          nullable: true
          example: USDC
        type:
          type: string
          example: supplied
        underlyingAssetAddress:
          type: string
          nullable: true
          example: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        underlyingAssetID:
          type: string
          nullable: true
          example: usd-coin
        underlyingAssetSymbol:
          type: string
          nullable: true
          example: USDC
        usd:
          type: number
          example: 1.23
      example:
        address: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        balance: 1.23
        balanceExact: abc123
        id: usd-coin
        market: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        name: USD Coin
        price: 1.23
        price24hAgo: 1.23
        protocol: aave
        proxy: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        quoteTime: '2024-01-01T00:00:00Z'
        symbol: USDC
        type: supplied
        underlyingAssetAddress: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        underlyingAssetID: usd-coin
        underlyingAssetSymbol: USDC
        usd: 1.23
    EntityLoansBalancesResponse:
      required:
      - entities
      - totalPositions
      - balances
      type: object
      properties:
        balances:
          type: object
          additionalProperties:
            type: array
