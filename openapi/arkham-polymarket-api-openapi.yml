                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                tokenAddresses:
                  description: Optional. Outcome token list. Intersected with eventID when supplied; otherwise overrides condition-derived tokens and…
                  anyOf:
                  - type: string
