      operationId: polymarket_leaderboard
      summary: Get Arkham Polymarket leaderboard
      tags:
      - Polymarket
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '2.00'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  description: Optional trade address. If set, also returns this user's rank.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                limit:
                  description: 'Max entries (1-200). Default: 100'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                offset:
                  description: 'Pagination offset (0-10000). Default: 0'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                order:
                  description: 'Sort order: desc (top traders) or asc (worst traders). Default: desc'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                period:
                  description: 'Time period: 1d, 1w, 1m, all. Default: 1d'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
