                      - type: string
                      - type: number
                      - type: boolean
              required:
              - conditionId
              additionalProperties:
                anyOf:
                - type: string
                - type: number
                - type: boolean
                - type: array
                  items:
                    anyOf:
                    - type: string
                    - type: number
                    - type: boolean
            example:
              conditionId: '0x9be56371f6a29d12769b2f196847ee825b9585ebb8bfa042136be031b081eba1'
      responses:
        '200':
          description: Successful response
          content:
