          application/json:
            schema:
              type: object
              properties:
                active:
                  description: Optional. Filter to active events — not closed and not ended (true/false).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                excludeTag:
                  description: Optional. Exclude events carrying this tag (case-insensitive).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                groupGames:
                  description: 'Optional. When true, return one winner event per sporting fixture instead of each related event. Default: false.'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                limit:
                  description: 'Max events to return (1-100). Default: 50.'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                offset:
                  description: 'Pagination offset. Default: 0.'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                order:
                  description: 'Sort order: asc or desc. Default: desc.'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                search:
                  description: Optional. Search event titles, market questions, and grouped-market titles.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                sortBy:
                  description: 'Optional. Sort field: volume, endDate (resolution eligibility), or createdAt. Default: volume when no tag, endDate when…'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
