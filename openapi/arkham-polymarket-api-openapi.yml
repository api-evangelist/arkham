                      - type: boolean
                userAddresses:
                  description: Optional. Filter to specific Polymarket trade addresses. Pass several as a single comma-separated value (e.g. '0x1543E5…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
