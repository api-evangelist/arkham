    name: Arkham Intelligence
    email: api@arkm.com
    url: https://api.arkm.com/x402
servers:
- url: https://api.arkm.com/x402
tags:
- name: Polymarket
paths:
  /polymarket/activity:
    post:
      operationId: polymarket_activity
      summary: Get Arkham Polymarket activity
      tags:
      - Polymarket
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '1.00'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actions:
                  description: 'Optional. Filter to one or more actions: buy, sell, split, merge, convert. Cannot be combined with eventType or directi…'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                conditionID:
                  description: Optional. Filter to a single market condition ID (all of its outcome tokens).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                cursor:
                  description: Optional. Pass an empty value on the first request to use cursor pagination, then pass the returned nextCursor without…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                direction:
                  description: 'Optional. Narrow trades to one side: buy or sell. Only valid with eventType=trade (or no eventType).'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                endTime:
                  description: Optional. Unix timestamp in seconds for the end of the range (exclusive).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                entityIDs:
                  description: Optional. Filter to activity attributed to specific Arkham entity IDs. Combined with userAddresses using OR. Pass sever…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                eventID:
                  description: Optional. Filter to all markets and outcomes in a Polymarket event.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                eventType:
                  description: 'Optional. Filter by event class: trade, split, merge, or convert. Use direction to narrow trades to one side.'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                fastPagination:
                  description: Fast pagination defaults to true. For offset pagination, set false to count matches up to 10,000. Cursor pagination alw…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                limit:
                  description: Max results (default 50, max 500).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                maxPrice:
                  description: Optional. Maximum per-share price as a 0-1 fraction.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                maxSize:
                  description: Optional. Maximum trade size in whole outcome-token shares.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                maxUsd:
                  description: Optional. Maximum notional (size * price) in whole USD.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                minPrice:
                  description: Optional. Minimum per-share price as a 0-1 fraction.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                minSize:
                  description: Optional. Minimum trade size in whole outcome-token shares.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                minUsd:
                  description: Optional. Minimum notional (size * price) in whole USD.
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                offset:
                  description: Offset for pagination (default 0, 0-10000).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                sortBy:
                  description: 'Column to order by: time (default), size (outcome-token shares), price (cents-per-share), usd (notional).'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                sortOrder:
                  description: 'Sort direction: asc or desc (default).'
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                startTime:
                  description: Optional. Unix timestamp in seconds for the start of the range (inclusive).
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                tokenAddresses:
                  description: Optional. Filter to specific outcome token addresses. The conditionID, eventID, and tokenAddresses filters are intersec…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                userAddresses:
                  description: Optional. Filter to specific Polymarket trade addresses. Pass several as a single comma-separated value (e.g. '0x1543E5…
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      anyOf:
                      - type: string
                      - type: number
                      - type: boolean
              additionalProperties:
                anyOf:
                - type: string
                - type: number
                - type: boolean
                - type: array
                  items:
                    anyOf:
                    - type: string
                    - type: number
                    - type: boolean
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {}
        '400':
          $ref: '#/components/responses/BadRequest400'
        '402':
          $ref: '#/components/responses/PaymentRequired402'
        '404':
          $ref: '#/components/responses/NotFound404'
        '429':
          $ref: '#/components/responses/RateLimited429'
        5XX:
          $ref: '#/components/responses/UpstreamError5xx'
      security: []
      description: Get Arkham Polymarket activity. $1.00 per call.
