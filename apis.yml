image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/arkham.png
name: Arkham
description: >-
  Arkham Intelligence operates a production-grade blockchain intelligence platform and REST API that
  provides entity attribution, address labels, wallet and entity intelligence, transfer and swap tracking,
  token and market data, portfolio and PnL history, DeFi loan positions, HyperCore and Polymarket analytics,
  and risk scoring across 20+ chains. The Arkham Intel API (v1.1.0) exposes 135 operations over 128 REST
  paths plus a WebSocket streaming surface for real-time transfers, authenticated with an API-Key header
  and billed by a usage-based credit model. Arkham also ships an agent-native x402 pay-per-request surface
  that lets AI agents buy individual API responses in USDC on Base with no account or key. Arkham was
  surfaced as a portfolio company of Anthemis and is a crypto / on-chain analytics provider.
